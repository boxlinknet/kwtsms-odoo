name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 kwtsms_sms/

  test:
    name: Odoo Tests
    runs-on: ubuntu-latest
    container:
      image: odoo:19
      options: --user root
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Run module tests
        run: |
          odoo -d test_db \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE \
            -i kwtsms_sms \
            --test-enable \
            --test-tags=kwtsms_sms,-kwtsms_e2e \
            --stop-after-init \
            --no-http \
            --db_host=db \
            --db_user=odoo \
            --db_password=odoo \
            2>&1 | tee /tmp/odoo-test.log

      - name: Check for test failures
        if: always()
        run: |
          if grep -q "0 failed, 0 error" /tmp/odoo-test.log; then
            echo "All tests passed"
          else
            echo "Test failures detected"
            tail -20 /tmp/odoo-test.log
            exit 1
          fi
